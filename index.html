<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grand Mind Arena - Ludo</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #080b14;
  color: white;
  min-height: 100vh;
}

header {
  padding: 18px;
  text-align: center;
  background: #0e1422;
  border-bottom: 1px solid #252d40;
}

header h1 {
  margin: 0;
  font-size: 25px;
}

header p {
  margin: 6px 0 0;
  color: #9da7bd;
  font-size: 13px;
}

.game-wrap {
  width: min(700px, 100%);
  margin: auto;
  padding: 15px;
}

.status {
  background: #111827;
  border: 1px solid #273149;
  border-radius: 15px;
  padding: 14px;
  text-align: center;
  margin-bottom: 15px;
}

#turnText {
  font-size: 18px;
  font-weight: bold;
}

#message {
  margin-top: 7px;
  color: #aeb7c9;
  font-size: 13px;
  min-height: 18px;
}

.board {
  width: min(92vw, 600px);
  aspect-ratio: 1;
  margin: auto;
  display: grid;
  grid-template-columns: repeat(15, 1fr);
  grid-template-rows: repeat(15, 1fr);
  background: #dfe4ea;
  border: 5px solid #202638;
  border-radius: 12px;
  overflow: hidden;
}

.cell {
  position: relative;
  border: 1px solid #c5cad2;
  background: #f5f6f8;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* Player yards */

.yard-red {
  grid-column: 1 / 7;
  grid-row: 1 / 7;
  background: #ef4444;
}

.yard-green {
  grid-column: 10 / 16;
  grid-row: 1 / 7;
  background: #22c55e;
}

.yard-yellow {
  grid-column: 1 / 7;
  grid-row: 10 / 16;
  background: #facc15;
}

.yard-blue {
  grid-column: 10 / 16;
  grid-row: 10 / 16;
  background: #3b82f6;
}

.yard-inner {
  width: 72%;
  height: 72%;
  background: white;
  border-radius: 18px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12%;
  padding: 12%;
}

.base-slot {
  border-radius: 50%;
  background: #e5e7eb;
  border: 2px solid #b8bec8;
}

/* Home */

.home {
  grid-column: 7 / 10;
  grid-row: 7 / 10;
  background: white;
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr;
}

.home div:nth-child(1) {
  background: #ef4444;
}

.home div:nth-child(2) {
  background: #22c55e;
}

.home div:nth-child(3) {
  background: #facc15;
}

.home div:nth-child(4) {
  background: #3b82f6;
}

/* Track */

.track {
  background: white;
}

.safe {
  background: #e5e7eb;
}

.red-track {
  background: #fecaca;
}

.green-track {
  background: #bbf7d0;
}

.yellow-track {
  background: #fef08a;
}

.blue-track {
  background: #bfdbfe;
}

/* Pieces */

.piece {
  width: 68%;
  height: 68%;
  border-radius: 50%;
  border: 2px solid white;
  box-shadow: 0 2px 5px rgba(0,0,0,.35);
  cursor: pointer;
  z-index: 5;
}

.piece.red {
  background: #dc2626;
}

.piece.green {
  background: #16a34a;
}

.piece.yellow {
  background: #eab308;
}

.piece.blue {
  background: #2563eb;
}

.piece.movable {
  outline: 4px solid white;
  animation: pulse .8s infinite alternate;
}

@keyframes pulse {
  from {
    transform: scale(1);
  }
  to {
    transform: scale(1.12);
  }
}

/* Controls */

.controls {
  margin-top: 15px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

button {
  min-height: 48px;
  border: 0;
  border-radius: 12px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

#diceBtn {
  background: white;
  color: #080b14;
}

#restartBtn {
  background: #20283a;
  color: white;
}

.dice {
  margin: 15px auto 0;
  width: 65px;
  height: 65px;
  border-radius: 15px;
  background: white;
  color: #111827;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 35px;
  font-weight: bold;
}

.players {
  margin-top: 15px;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}

.player {
  background: #111827;
  border: 1px solid #273149;
  padding: 12px;
  border-radius: 12px;
}

.player.active {
  outline: 2px solid white;
}

.dot {
  display: inline-block;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  margin-right: 7px;
}

.red-dot { background: #ef4444; }
.green-dot { background: #22c55e; }
.yellow-dot { background: #facc15; }
.blue-dot { background: #3b82f6; }

@media (max-width: 450px) {
  .game-wrap {
    padding: 8px;
  }

  .board {
    width: 96vw;
    border-width: 3px;
  }

  .yard-inner {
    gap: 6%;
  }

  .players {
    grid-template-columns: 1fr 1fr;
  }
}
</style>
</head>

  <h1>🎮 GRAND MIND ARENA</h1>
  <p>Classic Ludo • Human vs AI</p>
</header>

<div class="game-wrap">

        <div class="base-slot" id="red-base-3"></div>
      </div>
    </div>
