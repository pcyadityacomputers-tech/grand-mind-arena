<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grand Mind Arena - Ludo</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#10131a;
  color:white;
  min-height:100vh;
  text-align:center;
  padding:15px;
}

h1{
  margin:8px 0;
  font-size:28px;
}

.subtitle{
  color:#aaa;
  margin-bottom:12px;
}

.game{
  width:min(95vw,600px);
  margin:auto;
}

.info{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#1b202b;
  padding:12px;
  border-radius:12px;
  margin-bottom:12px;
}

#turn{
  font-weight:bold;
}

#dice{
  font-size:32px;
  font-weight:bold;
  background:#fff;
  color:#111;
  width:55px;
  height:55px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:10px;
}

button{
  border:0;
  border-radius:10px;
  padding:12px 20px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

#roll{
  background:#ffd43b;
  color:#111;
}

#roll:disabled{
  opacity:.4;
}

#message{
  min-height:24px;
  margin:10px 0;
  color:#ddd;
}

/* BOARD */

.board{
  width:100%;
  aspect-ratio:1;
  display:grid;
  grid-template-columns:repeat(15,1fr);
  grid-template-rows:repeat(15,1fr);
  gap:2px;
  background:#222;
  padding:3px;
  border-radius:12px;
  overflow:hidden;
}

/* four home areas */

.red-home{
  grid-column:1 / 7;
  grid-row:1 / 7;
  background:#e53935;
}

.green-home{
  grid-column:10 / 16;
  grid-row:1 / 7;
  background:#43a047;
}

.yellow-home{
  grid-column:1 / 7;
  grid-row:10 / 16;
  background:#fbc02d;
}

.blue-home{
  grid-column:10 / 16;
  grid-row:10 / 16;
  background:#1e88e5;
}

.home{
  display:grid;
  grid-template-columns:1fr 1fr;
  grid-template-rows:1fr 1fr;
  gap:8px;
  padding:18px;
}

.base{
  background:white;
  border-radius:50%;
  border:4px solid rgba(0,0,0,.3);
  position:relative;
}

.piece{
  position:absolute;
  width:70%;
  height:70%;
  left:15%;
  top:15%;
  border-radius:50%;
  border:3px solid white;
  box-shadow:0 3px 6px rgba(0,0,0,.5);
}

.red
